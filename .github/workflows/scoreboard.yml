name: Deploy scoreboard to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'scoreboard/**'
      - '.github/workflows/scoreboard.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scoreboard
  cancel-in-progress: true

defaults:
  run:
    working-directory: scoreboard

jobs:
  test:
    name: Lint, check, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scoreboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run tests
        run: npm test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scoreboard-playwright-report
          path: scoreboard/test-results/
          retention-days: 7

  deploy:
    name: Build and deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scoreboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: scoreboard
          command: deploy
